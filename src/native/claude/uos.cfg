# Native uOS foreground app: loaded bytes, BSS and C stack share one allocation.
MEMORY {
    ZP: file = "", start = $0002, size = $001a;
    LOAD: file = %O, start = $5ffe, size = 2;
    MAIN: file = %O, start = $6000, size = $6000, define = yes;
}
SEGMENTS {
    ZEROPAGE: load = ZP, type = zp;
    LOADADDR: load = LOAD, type = ro;
    HEADER: load = MAIN, type = ro;
    STARTUP: load = MAIN, type = ro;
    GUI: load = MAIN, type = ro, start = $6080;
    LOWCODE: load = MAIN, type = ro, optional = yes;
    ONCE: load = MAIN, type = ro, optional = yes;
    CODE: load = MAIN, type = ro;
    RODATA: load = MAIN, type = ro;
    DATA: load = MAIN, type = rw;
    BSS: load = MAIN, type = bss, define = yes;
    CSTACK: load = MAIN, type = bss, define = yes;
}
